# =============================================================================
# docker-user.conf - fail2ban action that actually blocks traffic to CONTAINER
#                    ports (Asterisk 5070, nginx 80/443).
#
# Install to /etc/fail2ban/action.d/docker-user.conf (scripts/deploy.sh does it).
# Referenced from jail.local as `banaction = docker-user`.
#
# WHY THIS EXISTS
#   Docker's published ports are DNAT'ed and evaluated in the FORWARD path, which
#   passes through the DOCKER-USER chain. ufw's rules live in the INPUT path, so a
#   `ufw deny from <ip>` has NO EFFECT on a packet destined for a container.
#   Every "fail2ban is banning but the attacker keeps registering" report is this
#   problem. DOCKER-USER is the one chain Docker guarantees it will not flush, so
#   inserting there is the supported way to filter container traffic.
#
# BEHAVIOUR
#   * one chain per jail: f2b-docker-<jail name>
#   * the chain is hooked at the TOP of DOCKER-USER, so it is evaluated before
#     Docker's own RETURN rule
#   * a ban DROPs every packet from the address, on all ports and protocols -
#     appropriate for a confirmed SIP brute-forcer or scanner
#   * all commands are idempotent (-C probes before -I / -A), so a fail2ban
#     restart, a docker restart or a repeated ban cannot pile up duplicates
#
# VERIFY
#   iptables -n -L DOCKER-USER --line-numbers
#   iptables -n -L f2b-docker-asterisk-security
#   fail2ban-client set asterisk-security banip 198.51.100.7
#   fail2ban-client set asterisk-security unbanip 198.51.100.7
# =============================================================================

[Definition]

# -w makes iptables wait for the xtables lock instead of failing when Docker is
# writing rules at the same moment (container start/stop).
actionstart = <iptables> -N f2b-docker-<name> 2>/dev/null || true
              <iptables> -A f2b-docker-<name> -j RETURN 2>/dev/null || true
              <iptables> -C DOCKER-USER -j f2b-docker-<name> 2>/dev/null || <iptables> -I DOCKER-USER 1 -j f2b-docker-<name>

# Unhook before deleting, or iptables refuses to remove a referenced chain.
actionstop = <iptables> -D DOCKER-USER -j f2b-docker-<name> 2>/dev/null || true
             <iptables> -F f2b-docker-<name> 2>/dev/null || true
             <iptables> -X f2b-docker-<name> 2>/dev/null || true

# Docker recreates DOCKER-USER when the daemon restarts, which drops our jump
# rule. actioncheck runs before every ban; returning false here makes fail2ban
# re-run actionstart, so bans survive a `systemctl restart docker`.
actioncheck = <iptables> -n -L DOCKER-USER | grep -q 'f2b-docker-<name>'

actionban = <iptables> -C f2b-docker-<name> -s <ip> -j DROP 2>/dev/null || <iptables> -I f2b-docker-<name> 1 -s <ip> -j DROP

actionunban = <iptables> -D f2b-docker-<name> -s <ip> -j DROP 2>/dev/null || true

[Init]

# Chain names are limited to 28 characters by iptables, so a long jail name would
# break silently. All jail names used here fit.
name = default
iptables = iptables -w

[Init?family=inet6]

# Only reachable if the Docker daemon runs with ip6tables enabled; otherwise the
# DOCKER-USER chain is absent for IPv6 and actioncheck simply reports false.
# Set `allowipv6 = no` in /etc/fail2ban/fail2ban.local on an IPv4-only host to
# keep the log clean.
iptables = ip6tables -w
