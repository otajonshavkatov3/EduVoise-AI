# =============================================================================
# asterisk-security.conf - fail2ban filter for Asterisk 20's SecurityEvent log
#
# Install to /etc/fail2ban/filter.d/asterisk-security.conf (scripts/deploy.sh
# does this). Paired with the [asterisk-security] jail in jail.local.
#
# WHAT IT PARSES
#   asterisk/etc/logger.conf routes the `security` level to its own file:
#       security => security
#   and res_security_log.c writes one line per event in this shape (line broken
#   here for readability - it is a single line in the file):
#
#   [2026-08-04 10:15:30.123] SECURITY[1234] res_security_log.c:
#       SecurityEvent="InvalidPassword",EventTV="2026-08-04T10:15:30.123+0500",
#       Severity="Error",Service="PJSIP",EventVersion="2",AccountID="101",
#       SessionID="0x7f9c...",LocalAddress="IPV4/UDP/0.0.0.0/5070",
#       RemoteAddress="IPV4/UDP/45.9.148.17/5060",Challenge="...",
#       ReceivedChallenge="...",ReceivedHash="..."
#
#   The prefix is Asterisk's own logger format (dateformat = %F %T.%3q in
#   logger.conf), NOT syslog - so this filter does not include common.conf,
#   whose __prefix_line assumes a syslog header.
#
#   use_callids = yes in logger.conf means an optional [C-0000001a] callid can
#   appear after the pid, hence the optional group in __prefix_line.
#
# TESTING (always do this after editing - a filter that matches nothing fails
# silently, which is the worst possible outcome for a ban rule):
#
#   fail2ban-regex /var/log/asterisk/security \
#       /etc/fail2ban/filter.d/asterisk-security.conf --print-all-matched
#
#   To generate a real failure to test against, register a softphone against
#   port 5070 with a wrong password three times.
# =============================================================================

[INCLUDES]
# Nothing: this file is self-contained on purpose (see the note about
# common.conf above).

[Definition]

_daemon = asterisk

__pid_re = (?:\[\d+\])
__callid_re = (?:\[C-[0-9a-fA-F]+\])

# [<timestamp>] SECURITY[pid][callid] <source-file>:
__prefix_line = ^\[[^\]]+\]\s*SECURITY%(__pid_re)s%(__callid_re)s?\s+[^:]+:\s*

# The SecurityEvent values that mean "somebody is trying to get in":
#   FailedACL              - source address not permitted by an ACL
#   InvalidAccountID       - probing for extensions that do not exist
#                            (the single most common scanner signature)
#   ChallengeResponseFailed- wrong response to our digest challenge
#   InvalidPassword        - correct extension, wrong secret: credential guessing
#   UnexpectedAddress      - registered contact answering from a different host
#   AuthMethodNotAllowed   - client insisting on an auth method we refuse
#   RequestNotSupported /
#   RequestNotAllowed /
#   RequestBadFormat       - malformed or hostile SIP, typical of fuzzers
#   SessionLimit /
#   MemoryLimit /
#   LoadAverageLimit       - resource exhaustion attempts (also a DoS symptom)
#
# NOT included: SuccessfulAuth and ChallengeSent - a normal registration emits
# ChallengeSent before every SuccessfulAuth, so banning on it would ban every
# legitimate phone.
#
# The address is matched with a LOOKAHEAD rather than by spelling out every field
# between SecurityEvent and RemoteAddress: Asterisk's field order varies by
# event type and version (EventVersion 1 vs 2), and a positional regex silently
# stops matching after an upgrade. [^\n]* keeps the lookahead on one line.
failregex = %(__prefix_line)sSecurityEvent="(?:FailedACL|InvalidAccountID|ChallengeResponseFailed|InvalidPassword|UnexpectedAddress|AuthMethodNotAllowed|RequestNotSupported|RequestNotAllowed|RequestBadFormat|SessionLimit|MemoryLimit|LoadAverageLimit)"(?=[^\n]*\bRemoteAddress="IPV[46]/(?:UDP|TCP|TLS|WS|WSS)/<HOST>/\d+")
            ^\[[^\]]+\]\s*NOTICE%(__pid_re)s%(__callid_re)s?\s+[^:]+:\s*Registration from '[^']*' failed for '<HOST>:\d+' - (?:Wrong password|Username/auth name mismatch|No matching endpoint found|Not a local domain|Device does not match ACL|Failed to authenticate)\s*$
            ^\[[^\]]+\]\s*NOTICE%(__pid_re)s%(__callid_re)s?\s+[^:]+:\s*(?:Request '[A-Z]+' from '[^']*' failed for '<HOST>:\d+'|No matching endpoint found for '<HOST>')

# Explicitly ignore the success events. They can never match failregex, but
# spelling them out documents the intent and protects against a future edit that
# widens the SecurityEvent alternation carelessly.
ignoreregex = SecurityEvent="(?:SuccessfulAuth|ChallengeSent|TransportStatus)"

[Init]

# Asterisk's logger prefixes each line with a bracketed local timestamp. Giving
# fail2ban the exact pattern avoids its date auto-detection, which can pick the
# EventTV field instead and then compute a wrong findtime window.
# The fractional part (.123) is left unmatched on purpose - fail2ban only needs
# to parse a date prefix, not the whole bracket.
datepattern = ^\[%%Y-%%m-%%d %%H:%%M:%%S

# The security file is written by Asterisk inside its container through a bind
# mount (see docker-compose.prod.yml), so a normal file backend sees the writes.
# maxlines stays 1: every SecurityEvent is a single self-contained line.
maxlines = 1

journalmatch =
