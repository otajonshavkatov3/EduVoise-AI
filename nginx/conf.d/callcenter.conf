#==============================================================================
# callcenter.conf - virtual host for the CallCenter "Aqlli Shahar" dashboard.
#
# RENDERING
#   This file is a TEMPLATE. scripts/deploy.sh and scripts/update.sh copy every
#   *.conf from nginx/conf.d/ into nginx/conf.d.rendered/ with __DOMAIN__
#   replaced by DOMAIN from .env, and it is conf.d.rendered/ that the nginx
#   container mounts at /etc/nginx/conf.d (see docker-compose.prod.yml). The two
#   directories are never mounted at the same time, so there is no duplicate
#   server_name.
#
#   __DOMAIN__ is a syntactically valid server_name, so an unrendered copy still
#   parses - but the TLS block below points at /etc/letsencrypt/live/__DOMAIN__/,
#   which would not exist. deploy.sh therefore also drops a self-signed bootstrap
#   certificate at the rendered path before the first start, so nginx comes up
#   cleanly BEFORE certbot has ever run. certbot then overwrites it with the
#   real chain.
#
# ROUTING MAP
#   /                     -> frontend:3001   (static Vite build, SPA fallback)
#   /api/auth/login       -> backend:4000    (strict rate limit)
#   /api/ws               -> backend:4000    (WebSocket upgrade, long timeouts)
#   /api/uploads          -> backend:4000    (large bodies, unbuffered)
#   /api/                 -> backend:4000    (normal API rate limit)
#   /doc, /reference      -> backend:4000    (OpenAPI JSON + Scalar UI)
#   /recordings/          -> filesystem, `internal` only (X-Accel-Redirect)
#   /metrics              -> denied (Prometheus scrapes backend:4000 directly)
#   /.well-known/acme-challenge/ -> certbot webroot
#==============================================================================

#------------------------------------------------------------------------------
# Port 80.
#
# Deliberately still SERVES the app rather than redirecting: this file has to
# work on a brand new VPS before any certificate exists, otherwise the first
# deploy is a chicken-and-egg failure (no cert -> redirect to https -> broken
# site -> certbot's HTTP-01 challenge cannot be served). Once certbot has
# issued the certificate, enable the redirect block marked ENABLE-AFTER-CERTS
# and delete/comment the location blocks under it.
#------------------------------------------------------------------------------
server {
	listen      80;
	listen      [::]:80;
	server_name __DOMAIN__ www.__DOMAIN__;

	# ACME HTTP-01 challenge. MUST stay reachable over plain HTTP forever, even
	# after the redirect is enabled, or certificate RENEWAL will fail in 90 days.
	location ^~ /.well-known/acme-challenge/ {
		root /var/www/certbot;
		default_type "text/plain";
		access_log off;
	}

	# Container-level healthcheck target: answers without touching any upstream,
	# so `docker inspect` reports nginx healthy even while the backend is still
	# starting. docker-compose.prod.yml's nginx healthcheck hits this.
	location = /nginx-health {
		access_log off;
		add_header Content-Type text/plain always;
		return 200 "ok\n";
	}

	# ---------------- ENABLE-AFTER-CERTS -------------------------------------
	# Uncomment these two lines (and remove everything below this block up to
	# the closing brace) once /etc/letsencrypt/live/__DOMAIN__/fullchain.pem is
	# a real Let's Encrypt certificate. 301 (not 302) so browsers and the HSTS
	# preload scanner cache it.
	#
	# location / {
	#     return 301 https://$host$request_uri;
	# }
	# ------------------------------------------------------------------------

	# Until then, plain HTTP mirrors the HTTPS routing. Same rules, no TLS.
	client_max_body_size 16m;

	proxy_http_version 1.1;
	proxy_set_header Host              $host;
	proxy_set_header X-Real-IP         $remote_addr;
	proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_set_header X-Forwarded-Host  $host;
	proxy_set_header X-Forwarded-Port  $server_port;

	location = /api/auth/login {
		limit_req zone=login burst=3 nodelay;
		proxy_pass http://callcenter_backend;
	}

	location /api/ws {
		proxy_pass http://callcenter_backend;
		proxy_set_header Upgrade    $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		proxy_read_timeout  3600s;
		proxy_send_timeout  3600s;
		proxy_buffering     off;
	}

	location /api/ {
		limit_req zone=api burst=40 nodelay;
		limit_conn perip 40;
		proxy_pass http://callcenter_backend;
	}

	location / {
		limit_req zone=general burst=120 nodelay;
		proxy_pass http://callcenter_frontend;
	}
}

#------------------------------------------------------------------------------
# Port 443 - the real vhost.
#------------------------------------------------------------------------------
server {
	# http2 as its own directive (not `listen ... http2`, deprecated since 1.25).
	listen      443 ssl;
	listen      [::]:443 ssl;
	http2       on;
	server_name __DOMAIN__ www.__DOMAIN__;

	#--------------------------------------------------------------------------
	# TLS. Paths are the standard certbot layout; deploy.sh guarantees they
	# exist (self-signed bootstrap on a fresh host, real chain afterwards).
	#--------------------------------------------------------------------------
	ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;

	# OCSP stapling needs the issuer chain; with certbot that is chain.pem.
	# Commented because a self-signed bootstrap cert has no chain and nginx
	# only warns - enable it together with the HTTPS redirect.
	# ssl_trusted_certificate /etc/letsencrypt/live/__DOMAIN__/chain.pem;
	# ssl_stapling        on;
	# ssl_stapling_verify on;
	# resolver            1.1.1.1 8.8.8.8 valid=300s;
	# resolver_timeout    5s;

	# TLS 1.2 is kept because some Uzbek corporate proxies and older Windows
	# desktops in municipal offices still cannot do 1.3. 1.0/1.1 are refused.
	ssl_protocols             TLSv1.2 TLSv1.3;
	ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
	# With TLS 1.3 the client picks; for 1.2 we insist on our order so a client
	# cannot negotiate down to a CBC suite.
	ssl_prefer_server_ciphers on;
	ssl_session_cache         shared:SSL:10m;
	ssl_session_timeout       1d;
	# Session tickets are disabled: without key rotation they weaken forward
	# secrecy, and the session cache already covers the reconnect case.
	ssl_session_tickets       off;
	# Larger DH group than the built-in 1024-bit default. Generate once with
	#   openssl dhparam -out /etc/letsencrypt/ssl-dhparams.pem 2048
	# (certbot ships this file too). Commented so a missing file cannot stop
	# nginx from starting.
	# ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

	#--------------------------------------------------------------------------
	# Security headers. `always` makes them appear on error responses too -
	# without it a 502 from the backend would come back header-less.
	#--------------------------------------------------------------------------
	# 2 years + preload is what hstspreload.org requires. Only meaningful once
	# real certificates are installed; a browser that sees HSTS from a
	# self-signed host will refuse to let the user click through afterwards, so
	# deploy.sh keeps this header out of the bootstrap phase by never pointing
	# users at HTTPS until certbot has run.
	add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
	# The dashboard is never meant to be framed - clickjacking a call-transfer
	# button is a real attack. frame-ancestors in the CSP covers modern
	# browsers; X-Frame-Options covers the old ones.
	add_header X-Frame-Options            "DENY" always;
	add_header X-Content-Type-Options     "nosniff" always;
	# Send the full URL only to ourselves; strangers get the origin at most.
	add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
	# Nothing in this app needs a camera, and geolocation/USB are pure attack
	# surface. Microphone IS needed: the WebRTC softphone records the operator.
	add_header Permissions-Policy         "microphone=(self), camera=(), geolocation=(), payment=(), usb=()" always;
	add_header Cross-Origin-Opener-Policy "same-origin" always;
	add_header X-XSS-Protection           "0" always;   # legacy filter, CSP replaces it

	#--------------------------------------------------------------------------
	# CSP tuned for THIS dashboard:
	#   script-src  'self'            - Vite emits hashed module files, no inline JS.
	#   style-src   + 'unsafe-inline' - antd's @ant-design/cssinjs injects <style>
	#                                   tags at runtime; removing this breaks the
	#                                   entire component library's theming.
	#   img/media   + data: blob:     - recharts data URIs, and the softphone plus
	#                                   the recording player use blob: URLs.
	#   connect-src + wss:            - /api/ws dashboard events AND sip.js's SIP
	#                                   over WebSocket to Asterisk.
	#   worker-src  blob:             - Vite/antd spawn workers from blobs.
	#--------------------------------------------------------------------------
	add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob:; connect-src 'self' https://__DOMAIN__ wss://__DOMAIN__; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;

	#--------------------------------------------------------------------------
	# Common proxy headers, declared once at server level and inherited by every
	# location. X-Forwarded-Proto is what makes the backend emit https:// URLs
	# and set `Secure` cookies.
	#--------------------------------------------------------------------------
	proxy_http_version 1.1;
	proxy_set_header Host              $host;
	proxy_set_header X-Real-IP         $remote_addr;
	proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_set_header X-Forwarded-Host  $host;
	proxy_set_header X-Forwarded-Port  $server_port;
	# Strip anything a client tries to inject into our internal-trust headers.
	proxy_set_header X-Accel-Internal  "";

	# Fail fast on a dead backend (5s) but allow slow AI/report endpoints to
	# finish (60s). The WebSocket location overrides the read timeout.
	proxy_connect_timeout 5s;
	proxy_send_timeout    60s;
	proxy_read_timeout    60s;
	# Retry the next upstream server on connection-level errors only. Retrying a
	# non-idempotent POST after a timeout could double-create a ticket, so
	# `timeout` and `http_500` are intentionally NOT in this list.
	proxy_next_upstream error invalid_header http_502 http_503 http_504;
	proxy_next_upstream_tries 2;

	client_max_body_size 16m;

	# Same ACME location as on :80 - harmless here, and it keeps `certbot
	# --nginx` from rewriting this file if someone runs it later.
	location ^~ /.well-known/acme-challenge/ {
		root /var/www/certbot;
		default_type "text/plain";
		access_log off;
	}

	location = /nginx-health {
		access_log off;
		add_header Content-Type text/plain always;
		return 200 "ok\n";
	}

	#--------------------------------------------------------------------------
	# Credential endpoint: 5 req/min/IP with burst=3.
	#
	# `nodelay` lets the 3 burst requests through immediately instead of queuing
	# them at 12s intervals - a human retyping a password should not wait, while
	# a brute-forcer still gets 429 from the 4th attempt onward.
	#
	# Exact match (`=`) so /api/auth/refresh and /api/auth/logout are NOT caught
	# by this zone; a 15-minute access token means refresh is called far more
	# often than 5/min per operator.
	#--------------------------------------------------------------------------
	location = /api/auth/login {
		limit_req zone=login burst=3 nodelay;
		# Also cap by connection: a distributed guesser opening 200 sockets is
		# still one IP here.
		limit_conn perip 10;
		proxy_pass http://callcenter_backend;
	}

	#--------------------------------------------------------------------------
	# Dashboard WebSocket (live calls, operator presence, transcript stream).
	#
	# proxy_buffering off is mandatory: with buffering on, nginx would hold
	# server->client frames until its buffer filled, which turns a live
	# transcript into a stuttering one. No rate limit - it is a single long
	# connection, and limit_req would count reconnect storms as abuse.
	#--------------------------------------------------------------------------
	location /api/ws {
		proxy_pass http://callcenter_backend;
		proxy_set_header Upgrade    $http_upgrade;
		proxy_set_header Connection $connection_upgrade;

		# 1 hour: longer than any idle gap the app's own ping/pong leaves, so
		# nginx never kills a healthy socket. The backend sends heartbeats.
		proxy_read_timeout  3600s;
		proxy_send_timeout  3600s;
		proxy_buffering     off;
		# WebSocket frames must not be gzipped by us; the protocol has its own
		# permessage-deflate negotiation.
		gzip off;
		access_log /var/log/nginx/access.log main;
	}

	#--------------------------------------------------------------------------
	# Recording upload / download through the API.
	#
	# 512m: a full-shift WAV batch. proxy_request_buffering off streams the body
	# straight to Bun instead of spooling it to /var/lib/nginx first, which
	# halves the disk I/O and lets the backend reject an oversized file early.
	#--------------------------------------------------------------------------
	location /api/uploads {
		limit_req zone=api burst=20 nodelay;
		client_max_body_size    512m;
		client_body_timeout     300s;
		proxy_request_buffering off;
		proxy_read_timeout      300s;
		proxy_send_timeout      300s;
		proxy_pass http://callcenter_backend;
	}

	#--------------------------------------------------------------------------
	# Everything else under /api.
	#--------------------------------------------------------------------------
	location /api/ {
		limit_req zone=api burst=40 nodelay;
		limit_conn perip 40;
		proxy_pass http://callcenter_backend;
		# Small responses dominate; 4 buffers of 16k avoids spilling JSON to
		# disk while keeping per-connection memory bounded.
		proxy_buffers      8 16k;
		proxy_buffer_size  16k;
	}

	#--------------------------------------------------------------------------
	# OpenAPI document and Scalar reference UI. They live at the ROOT of the
	# backend (not under /api), so they need their own locations.
	#
	# Lock them down before go-live: the schema enumerates every endpoint and
	# every field name, which is a free map for an attacker. Uncomment the
	# allow/deny pair and put the office CIDR in it.
	#--------------------------------------------------------------------------
	location ~ ^/(doc|reference)$ {
		# allow 10.0.0.0/8;
		# deny  all;
		limit_req zone=general burst=10 nodelay;
		proxy_pass http://callcenter_backend;
	}

	#--------------------------------------------------------------------------
	# Call recordings.
	#
	# `internal` is the whole point: this location is UNREACHABLE from outside.
	# The only way in is for the backend to authenticate the request, check that
	# the user may hear that call, and then answer with
	#     X-Accel-Redirect: /recordings/2026/08/04/call-123.wav
	# whereupon nginx serves the file itself with zero Bun involvement. That
	# gives authorised streaming at sendfile speed while an unauthenticated
	# GET /recordings/... gets a flat 404.
	#
	# A direct client request would otherwise expose every call in the archive -
	# recordings contain citizens' personal data, so this must never be a plain
	# static location. If you truly need direct access for debugging, comment
	# `internal` and uncomment the allow/deny pair instead of removing both.
	#--------------------------------------------------------------------------
	location /recordings/ {
		internal;
		alias /var/www/recordings/;

		# allow 127.0.0.1;
		# deny  all;

		# Range requests let the player seek without downloading the whole file.
		add_header Accept-Ranges bytes always;
		# Private: an intermediary must never cache somebody's call audio.
		add_header Cache-Control "private, max-age=0, no-store" always;
		add_header X-Content-Type-Options "nosniff" always;
		# Audio is already compressed - gzip would only burn CPU.
		gzip off;
		sendfile on;
		# Stream in 512k chunks so one long download cannot monopolise a worker.
		sendfile_max_chunk 512k;
		tcp_nopush on;
		access_log /var/log/nginx/access.log main;
	}

	#--------------------------------------------------------------------------
	# Metrics must never be public: they leak call volumes, operator names and
	# internal topology. Prometheus reaches backend:4000/metrics over the
	# private compose network and never through this proxy.
	#--------------------------------------------------------------------------
	location = /metrics {
		deny all;
		access_log off;
	}

	# Same reasoning for anything that would proxy to ARI/AMI. There is no
	# location that forwards to 8088/5038 anywhere in this file - this rule is
	# a tripwire in case someone adds one by copy-paste.
	location ^~ /ari {
		deny all;
		access_log off;
	}

	#--------------------------------------------------------------------------
	# Frontend. Vite emits content-hashed filenames under /assets, so those can
	# be cached forever; index.html must never be cached or operators keep
	# running yesterday's bundle after a deploy.
	#--------------------------------------------------------------------------
	location /assets/ {
		proxy_pass http://callcenter_frontend;
		expires 1y;
		add_header Cache-Control "public, immutable" always;
		access_log off;
	}

	location = /index.html {
		proxy_pass http://callcenter_frontend;
		add_header Cache-Control "no-store, must-revalidate" always;
		expires -1;
	}

	location / {
		limit_req zone=general burst=120 nodelay;
		limit_conn perip 40;
		proxy_pass http://callcenter_frontend;
		# The frontend container's own nginx does the SPA try_files fallback, so
		# deep links like /calls/42 return index.html from there.
	}

	#--------------------------------------------------------------------------
	# Error pages: never show nginx's default page (it advertises the server and
	# confuses operators). The frontend serves a styled 502 page if it is alive;
	# if it is not, this plain text is the fallback.
	#--------------------------------------------------------------------------
	error_page 502 503 504 /__offline.html;
	location = /__offline.html {
		internal;
		default_type text/html;
		return 503 "<!doctype html><meta charset=utf-8><title>Vaqtincha ishlamaydi</title><body style=\"font-family:sans-serif;padding:3rem\"><h1>Tizim vaqtincha ishlamaydi</h1><p>Bir necha daqiqadan keyin qayta urinib ko'ring.</p></body>";
	}
}

#------------------------------------------------------------------------------
# ALTERNATIVE UPSTREAM RESOLUTION (reference only - do not enable together with
# the upstream blocks in nginx.conf).
#
# If you want nginx to follow container IP changes without a reload, drop the
# upstream{} blocks and use Docker's embedded DNS with a variable proxy_pass:
#
#   resolver 127.0.0.11 valid=10s ipv6=off;
#   set $backend backend:4000;
#   proxy_pass http://$backend$request_uri;
#
# The $request_uri suffix is REQUIRED: with a variable in proxy_pass, nginx
# stops appending the matched URI automatically. The cost is losing upstream
# keepalive (a variable proxy_pass cannot use a keepalive pool), which adds a
# TCP handshake per request - hence it is not the default here.
#------------------------------------------------------------------------------
