#==============================================================================
# nginx.conf - main configuration for the CallCenter "Aqlli Shahar" edge proxy.
#
# This file is mounted read-only at /etc/nginx/nginx.conf inside the `nginx`
# service of docker-compose.prod.yml. Everything host-specific (server names,
# certificates, locations) lives in conf.d/callcenter.conf; this file only sets
# up the worker model, logging, compression, the shared rate-limit zones and the
# upstreams, because those are all http{}-level constructs that cannot be
# declared inside a server{} block.
#
# Facts this file is written against (do not "fix" them):
#   backend      -> backend:4000    (Bun/Hono, HTTP + WebSocket on the same port)
#   frontend     -> frontend:3001   (static Vite build served by its own nginx)
#   recordings   -> /var/www/recordings (read-only bind of the MixMonitor dir)
#   asterisk ARI -> 127.0.0.1:8088  NEVER proxied: backend-only, see conf.d
#==============================================================================

# The container image already runs the master as root and drops workers to
# `nginx`; naming the user explicitly keeps the config valid if the image is
# ever swapped for one with a different default.
user  nginx;

# One worker per available core. Inside a container this resolves to the
# cgroup's CPU quota on modern nginx builds, so it will not spawn 64 workers
# on a 2-core VPS slice.
worker_processes  auto;

# Each proxied request costs 2 file descriptors (client + upstream). WebSocket
# connections from the dashboard are long-lived, so the default 1024 limit is
# reached with only ~500 operators' browsers connected.
worker_rlimit_nofile 65535;

pid  /var/run/nginx.pid;
error_log  /var/log/nginx/error.log  warn;

events {
	worker_connections  4096;
	# Accept as many new connections as are pending per event loop pass instead
	# of one at a time - measurably lower connect latency under call-storm load.
	multi_accept  on;
}

http {
	include       /etc/nginx/mime.types;
	default_type  application/octet-stream;

	#--------------------------------------------------------------------------
	# MIME types for call recordings.
	#
	# nginx's bundled mime.types has NO entry for .wav - which is the format
	# MixMonitor writes here - so recordings would be served as
	# application/octet-stream and browsers would download instead of play them.
	# Only extensions that mime.types does not already define are listed; a
	# duplicate extension makes nginx log a warning on every start.
	#--------------------------------------------------------------------------
	types {
		audio/wav   wav;
		audio/ogg   opus;
		audio/basic ulaw ul alaw al;
		audio/gsm   gsm;
		audio/l16   sln slin;
	}

	#--------------------------------------------------------------------------
	# Logging. $request_time is the full client-visible latency and
	# $upstream_response_time is the backend's share of it; having both in the
	# access log is the only way to tell "the API is slow" from "the client's
	# uplink is slow" when the p95<200ms SLO alert fires.
	#--------------------------------------------------------------------------
	log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
		'$status $body_bytes_sent "$http_referer" '
		'"$http_user_agent" "$http_x_forwarded_for" '
		'rt=$request_time urt=$upstream_response_time '
		'uaddr=$upstream_addr cs=$upstream_cache_status';

	# JSON variant: uncomment (and swap it into access_log below) when shipping
	# logs to Loki/ELK. Kept separate so the human-readable format stays default.
	log_format  json_combined escape=json
		'{'
			'"ts":"$time_iso8601",'
			'"remote_addr":"$remote_addr",'
			'"request":"$request",'
			'"status":$status,'
			'"body_bytes":$body_bytes_sent,'
			'"request_time":$request_time,'
			'"upstream_time":"$upstream_response_time",'
			'"referer":"$http_referer",'
			'"user_agent":"$http_user_agent",'
			'"xff":"$http_x_forwarded_for"'
		'}';

	access_log  /var/log/nginx/access.log  main;

	#--------------------------------------------------------------------------
	# Connection / transfer tuning
	#--------------------------------------------------------------------------
	sendfile        on;
	# tcp_nopush batches response headers with the first data chunk (only has an
	# effect together with sendfile); tcp_nodelay disables Nagle so the small
	# WebSocket frames the dashboard exchanges are not delayed by up to 40ms.
	tcp_nopush      on;
	tcp_nodelay     on;

	keepalive_timeout   65;
	keepalive_requests  1000;
	reset_timedout_connection on;

	types_hash_max_size     4096;
	server_names_hash_bucket_size 128;

	# Never advertise the nginx version - it is free reconnaissance.
	server_tokens   off;

	#--------------------------------------------------------------------------
	# Request body limits.
	#
	# 16m is generous for the JSON APIs and for a single short recording upload.
	# The recording-upload location in conf.d raises this to 512m locally,
	# because a 60-minute WAV at 8kHz/16-bit is ~57MB and operators sometimes
	# batch-upload a whole shift.
	#--------------------------------------------------------------------------
	client_max_body_size    16m;
	client_body_buffer_size 128k;
	client_header_timeout   15s;
	client_body_timeout     60s;
	send_timeout            60s;
	large_client_header_buffers 4 16k;

	#--------------------------------------------------------------------------
	# Compression. Audio and images are already compressed, so they are absent
	# from gzip_types on purpose - re-compressing them burns CPU for nothing.
	# gzip_comp_level 5 is the knee of the size/CPU curve; 9 costs ~3x the CPU
	# for ~2% smaller output.
	#--------------------------------------------------------------------------
	gzip              on;
	gzip_vary         on;
	gzip_proxied      any;
	gzip_comp_level   5;
	gzip_min_length   1024;
	gzip_disable      "msie6";
	gzip_types
		application/atom+xml
		application/javascript
		application/json
		application/manifest+json
		application/rss+xml
		application/vnd.api+json
		application/wasm
		application/x-javascript
		application/xml
		font/ttf
		image/svg+xml
		text/css
		text/javascript
		text/plain
		text/xml;

	#--------------------------------------------------------------------------
	# WebSocket upgrade helper.
	#
	# The Connection header is hop-by-hop, so it must be rewritten per request:
	# "upgrade" when the client asked to upgrade, "close" otherwise. Sending a
	# literal `Connection: upgrade` on ordinary requests breaks keepalive to the
	# backend; this map is the canonical fix and is why /api/ws works while
	# /api/calls still gets pooled connections.
	#--------------------------------------------------------------------------
	map $http_upgrade $connection_upgrade {
		default upgrade;
		''      close;
	}

	# Trust the real client IP when this proxy itself sits behind another one
	# (Cloudflare, a load balancer). Only the private ranges are trusted so a
	# random client cannot spoof X-Forwarded-For.
	set_real_ip_from 10.0.0.0/8;
	set_real_ip_from 172.16.0.0/12;
	set_real_ip_from 192.168.0.0/16;
	set_real_ip_from 127.0.0.1/32;
	real_ip_header   X-Forwarded-For;
	real_ip_recursive on;

	#--------------------------------------------------------------------------
	# Rate limiting.
	#
	# Two zones, deliberately very different:
	#
	#  * login  - 5 requests/minute/IP. Password guessing is the only reason to
	#             hit /api/auth/login more often than that, and a human who
	#             mistypes twice still gets through thanks to burst=3. Failed
	#             logins beyond this are also what the fail2ban nginx jail eats.
	#  * api    - 30 requests/second/IP. The dashboard fires bursts of parallel
	#             requests on page load (calls + tickets + contacts + KPIs), so
	#             a low ceiling here would break normal use. This zone exists to
	#             stop scrapers and runaway retry loops, not to shape traffic.
	#
	# 10m of shared memory holds ~160k distinct IPs per zone, far more than a
	# single-tenant call centre will ever see.
	#--------------------------------------------------------------------------
	limit_req_zone $binary_remote_addr zone=login:10m  rate=5r/m;
	limit_req_zone $binary_remote_addr zone=api:10m    rate=30r/s;
	limit_req_zone $binary_remote_addr zone=general:10m rate=60r/s;

	# 429 instead of the default 503: 503 tells clients (and uptime monitors)
	# "server broken", 429 tells them "you, slow down" - and the frontend's
	# axios interceptor already backs off on 429.
	limit_req_status 429;
	limit_conn_status 429;
	# Log throttled requests at warn so the fail2ban nginx-limit-req jail can
	# see them in error.log.
	limit_req_log_level warn;

	# Cap concurrent connections per IP. The dashboard needs several (HTTP/1.1
	# parallelism + one WebSocket + one audio stream), so 40 is loose enough for
	# a shared office NAT while still stopping a single host from exhausting
	# worker_connections.
	limit_conn_zone $binary_remote_addr zone=perip:10m;

	#--------------------------------------------------------------------------
	# Upstreams.
	#
	# `keepalive` keeps idle connections to the backend open, which removes a
	# TCP (and, for a remote backend, TLS) handshake from every API call. That
	# is worth 1-3ms of the 200ms p95 budget and matters most on the dashboard's
	# request bursts.
	#
	# Caveat with Docker: nginx resolves these service names once at startup. If
	# the backend container is RECREATED (not just restarted) it may come back on
	# a new IP and nginx will keep dialling the old one until reloaded - which is
	# why scripts/update.sh always ends with `nginx -s reload`. If you prefer
	# nginx to re-resolve continuously instead, use the commented variable form
	# in conf.d/callcenter.conf.
	#--------------------------------------------------------------------------
	upstream callcenter_backend {
		server backend:4000 max_fails=3 fail_timeout=10s;
		keepalive 64;
		keepalive_timeout 60s;
		keepalive_requests 1000;
	}

	upstream callcenter_frontend {
		server frontend:3001 max_fails=3 fail_timeout=10s;
		keepalive 16;
	}

	#--------------------------------------------------------------------------
	# Virtual hosts. conf.d/callcenter.conf holds the HTTP and TLS server
	# blocks; the common proxy_set_header set lives there at server level so
	# every location inherits it.
	#--------------------------------------------------------------------------
	include /etc/nginx/conf.d/*.conf;
}
