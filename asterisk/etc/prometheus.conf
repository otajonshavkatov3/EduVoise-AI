;=============================================================================
; prometheus.conf - res_prometheus
;
; Without this file the module registers /metrics on the HTTP server but
; answers 503, because it defaults to disabled. Prometheus scrapes
; http://asterisk:8088/metrics.
;
; No auth_username/auth_password is set deliberately:
;   - on the dev host, 8088 is published to 127.0.0.1 only
;   - in production compose, Prometheus reaches the container directly over the
;     internal Docker network and 8088 is never published to the LAN
; So the endpoint is already unreachable from outside. Adding credentials here
; would mean shipping them to Prometheus as well for no gain in exposure.
; If you ever publish 8088, set both fields and add basic auth to the scrape
; job in monitoring/prometheus/prometheus.yml.
;=============================================================================

[general]
enabled = yes
; Served as http://<host>:8088/metrics
uri = metrics
; Asterisk's own process/uptime/version gauges.
core_metrics_enabled = yes
