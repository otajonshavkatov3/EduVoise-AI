;=============================================================================
; modules.conf
;
; autoload=yes does the real work. The explicit load => lines below are for
; the handful of modules this platform cannot function without: if one is
; missing from the image, Asterisk logs a loud error at startup instead of
; failing mysteriously on the first call.
;=============================================================================

[modules]
autoload = yes

; --- ARI: all call control goes through this ---
load => res_http_websocket.so
load => res_ari.so
load => res_ari_channels.so
load => res_ari_events.so
load => res_ari_bridges.so
load => res_ari_playbacks.so
load => res_ari_recordings.so
load => res_ari_asterisk.so
load => res_ari_endpoints.so
load => res_stasis.so
load => app_stasis.so

; --- AudioSocket: the audio path to the OpenAI Realtime bridge ---
load => res_audiosocket.so
load => chan_audiosocket.so
load => app_audiosocket.so

; --- SIP ---
load => res_pjsip.so
load => res_pjsip_session.so
load => res_pjsip_registrar.so
load => res_pjsip_outbound_registration.so
load => chan_pjsip.so

; --- Recording and hold ---
load => app_mixmonitor.so
load => res_musiconhold.so
load => app_voicemail.so

; --- AMI ---
load => manager.so

; --- Not wanted in a container ---
; chan_sip is the deprecated SIP stack. autoload=yes pulls it in, where it
; binds its own SIP port and logs a deprecation banner on every start. This
; platform is chan_pjsip only, so keep the old stack out entirely - it is also
; one less network listener to attack.
noload => chan_sip.so
; No telephony hardware exists here; chan_dahdi only produces errors.
noload => chan_dahdi.so
noload => codec_dahdi.so
; HEP/Homer capture is not deployed.
noload => res_hep.so
noload => res_hep_pjsip.so
noload => res_hep_rtcp.so
; No SIP trunk uses the deprecated stack.
noload => chan_mgcp.so
noload => chan_skinny.so
; The dialplan uses GoSub, never Macro(). Keeping app_macro out removes the
; last deprecation warning from a clean startup, so a genuine warning stands out.
noload => app_macro.so
noload => app_getcpeid.so
; res_adsi is deliberately NOT noloaded: app_voicemail links against it, and
; removing it makes voicemail decline to load.
