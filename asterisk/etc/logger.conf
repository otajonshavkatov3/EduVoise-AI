;=============================================================================
; logger.conf
;
; Container convention: everything of interest goes to stdout so
; `docker logs` and Docker's json-file driver own rotation. The on-disk files
; are still written because `asterisk -rx "core show ..."` debugging and the
; security log are much easier to read from a file.
;=============================================================================

[general]
dateformat = %F %T.%3q
use_callids = yes
queue_log = yes
; Buffering costs us the last few lines when a container is killed, and we
; care about those lines more than about the syscall overhead.
logger_queue_limit = 1000

[logfiles]
; stdout - picked up by `docker logs`
console => notice,warning,error,verbose

; Operational log: what went wrong, without the per-frame verbosity.
messages => notice,warning,error

; Full trace including DTMF. This is the file to read when a call behaved
; strangely; it is the only place dtmf and verbose land together.
full => notice,warning,error,verbose,dtmf

; Failed registrations and auth attempts. Fail2Ban tails this file.
security => security
