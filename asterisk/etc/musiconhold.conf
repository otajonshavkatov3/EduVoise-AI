;=============================================================================
; musiconhold.conf
;
; Files mode (not a piped external process) so no extra binary is needed in
; the image. The directory is provided by the asterisk-moh-opsound-wav
; package installed in docker/asterisk.Dockerfile.
;=============================================================================

[default]
mode = files
directory = /usr/share/asterisk/moh
sort = random
; Restart the stream for each caller rather than joining a shared position,
; so a caller placed on hold does not begin mid-note.
digit =
